<article class="card card--link post-card">
  <p class="u-mono post-card__date">
    <time datetime="{{DATE_ISO}}">{{DATE_HUMAN}}</time> · {{READ}} min read
  </p>
  <h3 class="post-card__title">
    <a class="card__stretch" href="/blog/{{SLUG}}/">{{TITLE}}</a>
  </h3>
  <p class="post-card__dek">{{DEK}}</p>
</article>
